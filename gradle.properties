# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Stonecutter: acknowledge Groovy buildscripts (skips the Kotlin DSL recommendation warning)
dev.kikugie.stonecutter.hard_mode=true
# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=net.bluegaria
archives_base_name=Titlescreen
# Fabric loader (same for every supported Minecraft version)
loader_version=0.19.5
# Video playback: bundled FFmpeg (JavaCPP presets). The libraries ship inside the mod jar,
# so no system installation is required.
javacpp_version=1.5.14
ffmpeg_version=8.1.2-1.5.14
# JNA remains bundled for the libc setenv() call that helps Minecraft's own OpenAL device open
# inside sandboxed launchers (see TitlescreenClient.prepareOpenAlDrivers). jna-platform is not
# needed anymore (it was only used by vlcj).
jna_version=5.16.0
# Set to false to build without bundling javacpp/FFmpeg/JNA (the video then needs those
# libraries on the classpath some other way)
bundle_video_libraries=true
#
# Per-Minecraft-version values (fabric api, cloth config, mod menu, java target, ...)
# live in versions/<mc>/gradle.properties. See settings.gradle for the version list.
