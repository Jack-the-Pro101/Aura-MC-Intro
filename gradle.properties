# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.2
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=net.bluegaria
archives_base_name=Titlescreen
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.161.0+26.2
# Mod Menu (optional, not bundled) + its required Placeholder API (dev runtime only)
modmenu_version=20.0.3
placeholder_api_version=3.1.0-beta.1+26.2
# Cloth Config - provides the in-game config screen (bundled via jar-in-jar)
cloth_config_version=26.2.155+fabric
# Video playback: vlcj (libVLC binding) + JNA (bundled via jar-in-jar)
vlcj_version=4.12.1
# vlcj's runtime support classes (native discovery) live in this separate artifact
vlcj_natives_version=4.12.0
jna_version=5.16.0
# Set to false to build without bundling vlcj/JNA (video then requires a separately installed copy)
bundle_video_libraries=true
