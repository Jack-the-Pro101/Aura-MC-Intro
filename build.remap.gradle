// Fabric nodes for 1.21.x. Those versions still ship obfuscated jars, so loom runs in its
// remapping mode (`fabric-loom-remap`): dependencies are declared on the mod* configurations
// and the built jar is remapped to intermediary names, exactly like classic Fabric tooling.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

apply from: rootProject.file('gradle/common.gradle')
apply from: rootProject.file('gradle/fabric.gradle')
