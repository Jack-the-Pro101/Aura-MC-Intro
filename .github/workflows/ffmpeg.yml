name: Build minimal FFmpeg

# Builds the small FFmpeg libraries the mod bundles (VP9/Opus decoders, Matroska demuxing,
# swscale/swresample and VP9-only hardware acceleration) for every supported platform. Manual
# only (workflow_dispatch), because the libraries rarely change:
#
#   1. Run this workflow from the repository's Actions tab.
#   2. Download the five per-platform zips from the finished run's Artifacts section.
#   3. Drop them into gradle/ffmpeg/libraries/ and commit them.
#
# The Gradle build then bundles the committed zips instead of the (much larger) bytedeco
# libraries through the `ffmpeg_libraries` property in gradle.properties.

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: '8.1.2'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            packages: 'libva-dev' # VAAPI headers (compiled against, not linked); NVDEC headers are installed below
          - platform: linux-arm64
            os: ubuntu-24.04
            # libva-dev:arm64 provides the VAAPI headers and the .pc files configure probes
            # (build-minimal.sh points pkg-config at the arm64 ones); libva itself is not linked.
            packages: 'crossbuild-essential-arm64 libva-dev:arm64'
          - platform: windows-x86_64
            os: ubuntu-24.04
            packages: gcc-mingw-w64-x86-64
          - platform: macosx-arm64
            os: macos-14
            packages: ''
          # Cross-compiled on the Apple Silicon image: build-minimal.sh passes Apple clang the
          # x86_64 -arch flags, because GitHub's Intel (macos-13) runners are being retired and
          # spend forever queued. nasm (an arm64 binary there) still assembles the x86_64 asm.
          - platform: macosx-x86_64
            os: macos-14
            packages: nasm
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "${{ matrix.packages }}" ]; then brew install ${{ matrix.packages }}; fi
          else
            # Foreign-arch packages (linux-arm64's libva-dev:arm64) need more than registering
            # the architecture: the amd64 archives carry no binary-arm64 indexes, so apt-get
            # update 404s and aborts. Restrict the built-in deb822 sources to the native arch
            # and add an arm64-only stanza for the ports archive, where the arm64 packages
            # (and their dependencies) actually live.
            case "${{ matrix.packages }}" in *:arm64*)
              sudo dpkg --add-architecture arm64
              for sources in /etc/apt/sources.list.d/*.sources; do
                [ -f "$sources" ] || continue
                if ! grep -q '^Architectures:' "$sources"; then
                  sudo sed -i 's/^Suites:/Architectures: amd64\nSuites:/' "$sources"
                fi
              done
              suite=$(. /etc/os-release && echo "$VERSION_CODENAME")
              printf '%s\n' \
                'Types: deb' \
                'URIs: http://ports.ubuntu.com/ubuntu-ports' \
                "Suites: $suite $suite-updates $suite-backports $suite-security" \
                'Components: main restricted universe multiverse' \
                'Architectures: arm64' \
                'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
                | sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null
            ;; esac
            sudo apt-get update
            sudo apt-get install -y nasm ${{ matrix.packages }}
          fi

      - name: Install nv-codec-headers (NVIDIA NVDEC, linux-x86_64 only)
        if: matrix.platform == 'linux-x86_64'
        run: |
          git clone --depth 1 -b n12.2.72.0 https://github.com/FFmpeg/nv-codec-headers.git /tmp/nv-codec-headers
          # The runner user cannot write to /usr, so the install needs sudo
          # (the tags/* checkout warning from --depth 1 is harmless).
          sudo make -C /tmp/nv-codec-headers install PREFIX=/usr
          # Fail here, not inside FFmpeg's configure later, if the headers are
          # somehow not visible to pkg-config.
          pkg-config --modversion ffnvcodec

      # Cache only the downloaded tarball, never the extracted tree: the tree contains object
      # files for whatever platform built it, and this key is shared by the whole matrix.
      # Restoring another platform's tree made the linkers choke on foreign-architecture
      # objects ("Relocations in generic ELF (EM: 183)"). Extracting per job is cheap and
      # always clean; the script additionally runs `make distclean` before configuring.
      - name: Cache FFmpeg sources
        uses: actions/cache@v5
        with:
          path: sources/ffmpeg.tar.xz
          key: ffmpeg-src-tarball-${{ env.FFMPEG_VERSION }}

      - name: Restore build output
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: out
          key: ffmpeg-min-${{ env.FFMPEG_VERSION }}-${{ matrix.platform }}-${{ hashFiles('gradle/ffmpeg/build-minimal.sh') }}

      - name: Build
        # Also rebuild when a restored cache lacks the staged libraries (for example
        # one saved by an older run) instead of failing later at the upload step.
        if: success() && (steps.build-cache.outputs.cache-hit != 'true' || hashFiles(format('out/stage-{0}/*', matrix.platform)) == '')
        run: bash gradle/ffmpeg/build-minimal.sh ${{ matrix.platform }}
        env:
          FFMPEG_VERSION: ${{ env.FFMPEG_VERSION }}
          # No zip from the script: GitHub wraps the uploaded files into one on download.
          FFMPEG_NO_ZIP: '1'

      # Explicit save (instead of the implicit post step of actions/cache) so a
      # failed build never caches a partial out/ directory.
      - name: Save build output
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: out
          key: ffmpeg-min-${{ env.FFMPEG_VERSION }}-${{ matrix.platform }}-${{ hashFiles('gradle/ffmpeg/build-minimal.sh') }}

      - name: Upload build artifact (kept 90 days)
        uses: actions/upload-artifact@v6
        with:
          # The five libraries are uploaded loose; the artifact name becomes the name of the zip
          # GitHub packs around them on download (ffmpeg-<version>-min-<platform>.zip - the name
          # the Gradle build matches - with the libraries at the zip root). Download it from this
          # run's Artifacts and commit it unchanged into gradle/ffmpeg/libraries/.
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-min-${{ matrix.platform }}
          path: out/stage-${{ matrix.platform }}
          retention-days: 90
          if-no-files-found: error
