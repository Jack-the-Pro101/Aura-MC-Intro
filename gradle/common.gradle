// Common node configuration, shared by all Minecraft versions. Applied from the
// per-node build scripts (build.gradle for 26.x, build.remap.gradle for 1.21.x),
// which differ only in the loom plugin variant and the dependency configurations.
//
// This script runs once for every supported Minecraft version (see settings.gradle).
// Version-specific values live in versions/<mc>/gradle.properties, shared values in
// the root gradle.properties. sc.current.version is the current node's MC version.

// Mod version is suffixed with the Minecraft version, e.g. Titlescreen-1.0-SNAPSHOT+26.2.jar
version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "titlescreen" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

stonecutter {
    // The shared source is written against the 26.x API; 1.21.x builds get the 1.21
    // names swapped in. The replacements are direction-based and reversible: on 26.x
    // nodes the reverse rewrite is a no-op, because text already in the "output" form
    // is preserved by the replacement engine. Patterns are deliberately long (quotes,
    // semicolons, whole statements) so they only ever match mixin/annotation strings.
    replacements.string(sc.current.parsed.matches('<26.1')) {
        // Immediate GuiGraphics rendering on 1.21.x vs the GuiGraphicsExtractor pipeline on 26.x
        replace 'GuiGraphicsExtractor', 'GuiGraphics'
        // Mixin method attributes and descriptor targets (quoted, so they only match annotation strings)
        replace 'method = "extractRenderState"', 'method = "render"'
        replace ';extractRenderState(', ';render('
        replace 'method = "extractIcons"', 'method = "drawIcons"'
        replace 'method = "extractProgressBar"', 'method = "drawProgressBar"'
        // The logo fade is a named method on 1.21.x with its own descriptor
        replace '"extractRenderState(Lnet/minecraft/client/gui/GuiGraphicsExtractor;IF)V"',
                '"renderLogo(Lnet/minecraft/client/gui/GuiGraphics;IF)V"'
    }
    replacements.string(sc.current.parsed.matches('1.21.10')) {
        // ResourceLocation was still called that in 1.21.10, and Util lives one package up
        replace 'Identifier', 'ResourceLocation'
        replace 'import net.minecraft.util.Util;', 'import net.minecraft.Util;'
    }
    replacements.string(sc.current.parsed.matches('>=26.3')) {
        // 26.3 moved the render pipeline and texture types into the renderpearl API
        replace 'com.mojang.blaze3d.pipeline', 'com.mojang.renderpearl.api.pipeline'
        replace 'com/mojang/blaze3d/pipeline', 'com/mojang/renderpearl/api/pipeline'
        replace 'com.mojang.blaze3d.textures', 'com.mojang.renderpearl.api.textures'
        replace 'com/mojang/blaze3d/textures', 'com/mojang/renderpearl/api/textures'
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Modrinth maven - used for Mod Menu, Placeholder API and Cloth Config
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup "maven.modrinth"
        }
    }
}

// The FFmpeg platforms bundled with the mod (prebuilt libraries from the JavaCPP presets).
def ffmpegPlatforms = ['windows-x86_64', 'linux-x86_64', 'linux-arm64', 'macosx-x86_64', 'macosx-arm64']

// The player only uses avutil/avcodec/avformat/swresample/swscale - avdevice, avfilter and the
// ffmpeg/ffprobe command line programs (roughly 40% of every natives jar) are dead weight for
// VP9-in-WebM playback. Loom's jar-in-jar mechanism requires module components, so each trimmed
// jar is written into a build-local Maven repository (as net.bluegaria.ffmpeg:ffmpeg-natives)
// and nested from there like any regular dependency.
def ffmpegMaven = project.layout.buildDirectory.dir('ffmpeg-maven')

if (project.bundle_video_libraries.toBoolean()) {
    ffmpegPlatforms.each { platform ->
        tasks.register("trimFfmpegNatives${platform.replaceAll(/[^a-zA-Z0-9]/, '_')}") {
            description = "Trims the bundled FFmpeg natives (${platform}) to the libraries the player loads."
            def source = configurations.detachedConfiguration(
                    dependencies.create("org.bytedeco:ffmpeg:${project.ffmpeg_version}:${platform}") {
                        transitive = false
                    })
            def outFile = ffmpegMaven
                    // Maven repository layout: group (net.bluegaria.ffmpeg) with dots as slashes.
                    .map { it.dir("net/bluegaria/ffmpeg/ffmpeg-natives/${project.ffmpeg_version}") }
                    .map { it.file("ffmpeg-natives-${project.ffmpeg_version}-${platform}.jar") }
            inputs.property('platform', platform)
            inputs.files(source)
            outputs.file(outFile)
            doLast {
                def inputJar = source.files.find { it.name.endsWith("-${platform}.jar") }
                def target = outFile.get().asFile
                target.parentFile.mkdirs()
                new java.util.zip.ZipFile(inputJar).withCloseable { zip ->
                    new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(target)).withCloseable { out ->
                        zip.entries().each { entry ->
                            def name = entry.name.tokenize('/')[-1]
                            def dropped = name.contains('avdevice') || name.contains('avfilter')
                                    || name.contains('postproc') || name.startsWith('jnijavacpp')
                                    || name in ['ffmpeg', 'ffprobe', 'ffmpeg.exe', 'ffprobe.exe']
                            if (dropped) {
                                return
                            }
                            out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (!entry.directory) {
                                zip.getInputStream(entry).withCloseable { it.transferTo(out) }
                            }
                            out.closeEntry()
                        }
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'FfmpegNatives'
            url = ffmpegMaven
            // The repository only holds the trimmed jars, no POMs.
            metadataSources { artifact() }
            content {
                includeGroup 'net.bluegaria.ffmpeg'
            }
        }
    }

    // The nested jars are resolved when loom processes the mod jar - by then the trimmed
    // jars must exist.
    tasks.matching { it.name == 'processIncludeJars' }.configureEach {
        dependsOn tasks.matching { it.name.startsWith('trimFfmpegNatives') }
    }
}


dependencies {
    // To change the versions see the versions/<mc>/gradle.properties file
    minecraft "com.mojang:minecraft:${sc.current.version}"

    // 1.21.x ships obfuscated jars (remapping loom variant), 26.x does not.
    if (sc.current.parsed.matches('<26.1')) {
        // Obfuscated environment (1.21.x): dependencies must be remapped to the
        // compile mappings, and the built jar is remapped to intermediary names.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        // Cloth Config - in-game config screen (bundled so users do not have to install it themselves)
        modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
        include "maven.modrinth:cloth-config:${project.cloth_config_version}"

        // Mod Menu - optional integration, deliberately NOT bundled
        modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
        // Mod Menu requires Placeholder API at runtime; only needed for the dev environment
        modRuntimeOnly "maven.modrinth:placeholder-api:${project.placeholder_api_version}"
    } else {
        // Non-obfuscated environment (26.x): no remapping configurations exist,
        // mods are consumed on the plain configurations.
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        // Cloth Config - in-game config screen (bundled so users do not have to install it themselves)
        implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
        include "maven.modrinth:cloth-config:${project.cloth_config_version}"

        // Mod Menu - optional integration, deliberately NOT bundled
        implementation "maven.modrinth:modmenu:${project.modmenu_version}"
        // Mod Menu requires Placeholder API at runtime; only needed for the dev environment
        runtimeOnly "maven.modrinth:placeholder-api:${project.placeholder_api_version}"
    }

    // MixinExtras is shipped by the loader at runtime; this is only for compile-time annotations.
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"

    // Video playback: FFmpeg is bundled with the mod (JavaCPP presets), so nothing has to be
    // installed on the system. libavformat demuxes the WebM container, libavcodec decodes
    // (VP9 video, Opus/Vorbis audio), libswscale converts pictures to RGBA and libswresample
    // resamples the sound for audio output.
    implementation "org.bytedeco:javacpp:${project.javacpp_version}"
    implementation "org.bytedeco:ffmpeg:${project.ffmpeg_version}"
    // In the dev environment the natives for the running platform come from these jars as well;
    // the built jar nests only trimmed copies (see the trimFfmpegNatives tasks above).
    ffmpegPlatforms.each { platform ->
        implementation "org.bytedeco:ffmpeg:${project.ffmpeg_version}:${platform}"
    }

    if (project.bundle_video_libraries.toBoolean()) {
        // The Java binding layer (javacpp) plus the FFmpeg API classes.
        include "org.bytedeco:javacpp:${project.javacpp_version}"
        include "org.bytedeco:ffmpeg:${project.ffmpeg_version}"
        // JNA remains for the libc setenv() call in TitlescreenClient (OpenAL inside sandboxes).
        include "net.java.dev.jna:jna:${project.jna_version}"
        // The prebuilt libraries, trimmed (see the trimFfmpegNatives tasks above) and nested
        // from the build-local repository.
        ffmpegPlatforms.each { platform ->
            include "net.bluegaria.ffmpeg:ffmpeg-natives:${project.ffmpeg_version}:${platform}"
        }
    }
}

// Both resource tasks (main and client source sets) fill in the version placeholders
// for fabric.mod.json and the mixin config.
def expandProps = [
        "version"                : project.version.toString(),
        "minecraft_version"      : sc.current.version,
        "loader_version"         : project.loader_version.toString(),
        "minecraft_dependency"   : project.minecraft_dependency.toString(),
        "cloth_config_dependency": project.cloth_config_dependency.toString(),
        "modmenu_dependency"     : project.modmenu_dependency.toString(),
        "mixin_compat"           : project.mixin_compat.toString(),
        "versioned_mixins"       : project.versioned_mixins.toString()
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties(expandProps)
    filteringCharset "UTF-8"

    filesMatching(["fabric.mod.json", "titlescreen.client.mixins.json", "titlescreen.versioned.mixins.json"]) {
        expand expandProps
    }
}

def targetJavaVersion = (project.java_target as String).toInteger()
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}