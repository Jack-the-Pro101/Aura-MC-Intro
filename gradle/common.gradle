// Common node configuration, shared by every (Minecraft version, loader) node. Applied
// from the per-node build scripts after their plugins:
//   build.gradle          - Fabric, 26.x (loom, non-obfuscated)      + gradle/fabric.gradle
//   build.remap.gradle    - Fabric, 1.21.x (loom, remapping)          + gradle/fabric.gradle
//   build.neoforge.gradle - NeoForge, every version (ModDevGradle)   + gradle/neoforge.gradle
//
// Nodes are named "<mc>-<loader>" (see settings.gradle). Minecraft-specific values live in
// gradle/mc/<mc>.properties, shared values in the root gradle.properties.

def mcProperties = new Properties()
rootProject.file("gradle/mc/${sc.current.version}.properties").withInputStream { mcProperties.load(it) }
mcProperties.each { key, value -> project.ext.set(key as String, value) }

def loader = sc.current.project.tokenize('-')[-1]
project.ext.loader = loader

// e.g. Aura-Intro-1.0-SNAPSHOT+1.21.1-neoforge.jar
version = "${project.mod_version}+${sc.current.version}-${loader}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

stonecutter {
    // `//? if fabric {` / `//? if neoforge {` select the loader-specific code.
    constants.match(loader, 'fabric', 'neoforge')

    // The shared source is written against the 26.x API; 1.21.x builds get the 1.21
    // names swapped in. The replacements are direction-based and reversible: on 26.x
    // nodes the reverse rewrite is a no-op, because text already in the "output" form
    // is preserved by the replacement engine. Patterns are deliberately long (quotes,
    // semicolons, whole statements) so they only ever match mixin/annotation strings.
    replacements.string(sc.current.parsed.matches('<26.1')) {
        // Immediate GuiGraphics rendering on 1.21.x vs the GuiGraphicsExtractor pipeline on 26.x
        replace 'GuiGraphicsExtractor', 'GuiGraphics'
        // Mixin method attributes and descriptor targets (quoted, so they only match annotation strings)
        replace 'method = "extractRenderState"', 'method = "render"'
        replace ';extractRenderState(', ';render('
        replace 'method = "extractIcons"', 'method = "drawIcons"'
        replace 'method = "extractProgressBar"', 'method = "drawProgressBar"'
        // The logo fade is a named method on 1.21.x with its own descriptor
        replace '"extractRenderState(Lnet/minecraft/client/gui/GuiGraphicsExtractor;IF)V"',
                '"renderLogo(Lnet/minecraft/client/gui/GuiGraphics;IF)V"'
    }
    replacements.string(sc.current.parsed.matches('<1.21.11')) {
        // ResourceLocation was still called that up to 1.21.10, and Util lives one package up
        replace 'Identifier', 'ResourceLocation'
        replace 'import net.minecraft.util.Util;', 'import net.minecraft.Util;'
    }
    replacements.string(sc.current.parsed.matches('>=26.3')) {
        // 26.3 moved the render pipeline and texture types into the renderpearl API
        replace 'com.mojang.blaze3d.pipeline', 'com.mojang.renderpearl.api.pipeline'
        replace 'com/mojang/blaze3d/pipeline', 'com/mojang/renderpearl/api/pipeline'
        replace 'com.mojang.blaze3d.textures', 'com.mojang.renderpearl.api.textures'
        replace 'com/mojang/blaze3d/textures', 'com/mojang/renderpearl/api/textures'
    }
}

repositories {
    // Modrinth maven - used for Mod Menu, Placeholder API and Cloth Config. Exclusive: no other
    // repository is ever asked for these, so an outage elsewhere (a 502 from a loader's maven used
    // to disable that whole repository for the build) cannot break their resolution, and vice versa.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

// The FFmpeg platforms bundled with the mod (prebuilt libraries from the JavaCPP presets).
def ffmpegPlatforms = ['windows-x86_64', 'linux-x86_64', 'linux-arm64', 'macosx-x86_64', 'macosx-arm64']
project.ext.ffmpegPlatforms = ffmpegPlatforms

// Folder with the committed minimal FFmpeg libraries (see gradle.properties): the artifact zips
// (GitHub packs them around the loose libraries the ffmpeg.yml workflow uploads), downloaded from
// a workflow run's Artifacts by hand and committed at gradle/ffmpeg/libraries/. Resolved per
// platform in the trim tasks below.
def ffmpegLibsDir = (project.findProperty('ffmpeg_libraries') ?: '') as String

// The player only uses avutil/avcodec/avformat/swresample/swscale - avdevice, avfilter and the
// ffmpeg/ffprobe command line programs (roughly 40% of every natives jar) are dead weight for
// VP9-in-WebM playback. Jar-in-jar (loom's and NeoForge's alike) requires module components, so each
// trimmed jar is written into a build-local Maven repository (as
// net.bluegaria.ffmpeg:ffmpeg-natives-<platform>) and nested from there like any regular dependency.
// One artifact per platform rather than one artifact with five classifiers: NeoForge's jar-in-jar
// tells nested jars apart by group and artifact only, and would keep just one platform.
def ffmpegMaven = project.layout.buildDirectory.dir('ffmpeg-maven')

if (project.bundle_video_libraries.toBoolean()) {
    ffmpegPlatforms.each { platform ->
        // NeoForge's jarJar resolves the nested jars while the task graph is built - before the trim task
        // below ran. A placeholder lets that resolution succeed; the task replaces it before jarJar reads it.
        def placeholder = ffmpegMaven.get()
                .file("net/bluegaria/ffmpeg/ffmpeg-natives-${platform}/${project.ffmpeg_version}/ffmpeg-natives-${platform}-${project.ffmpeg_version}.jar")
                .asFile
        if (!placeholder.exists()) {
            placeholder.parentFile.mkdirs()
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(placeholder)).withCloseable { zip ->
                zip.putNextEntry(new java.util.zip.ZipEntry('META-INF/MANIFEST.MF'))
                zip.write('Manifest-Version: 1.0\n'.bytes)
                zip.closeEntry()
            }
        }
        def trimTask = tasks.register("trimFfmpegNatives${platform.replaceAll(/[^a-zA-Z0-9]/, '_')}") {
            description = "Trims the bundled FFmpeg natives (${platform}) to the libraries the player loads."
            def source = configurations.detachedConfiguration(
                    dependencies.create("org.bytedeco:ffmpeg:${project.ffmpeg_version}:${platform}") {
                        transitive = false
                    })
            def outFile = ffmpegMaven
                    // Maven repository layout: group (net.bluegaria.ffmpeg) with dots as slashes.
                    .map { it.dir("net/bluegaria/ffmpeg/ffmpeg-natives-${platform}/${project.ffmpeg_version}") }
                    .map { it.file("ffmpeg-natives-${platform}-${project.ffmpeg_version}.jar") }
            inputs.property('platform', platform)
            inputs.files(source)


            // The custom minimal libraries replace bytedeco's by name (same FFmpeg release, so
            // the JNI wrappers bind unchanged): either <platform>.zip / ffmpeg-*-min-<platform>.zip
            // in the ffmpeg_libraries folder, or a plain <platform>/ subfolder. The files are task
            // inputs, so committing new zips re-runs the trim instead of nesting stale libraries.
            // Relative folder paths resolve against the repository root, not the version node.
            def customBase = ffmpegLibsDir ? project.rootProject.file(ffmpegLibsDir) : null
            def customZip = customBase?.listFiles()?.find {
                it.isFile() && (it.name == "${platform}.zip" || it.name.endsWith("-${platform}.zip"))
            }
            def customFolder = customBase ? new File(customBase, platform) : null
            def customFolderFiles = customFolder?.isDirectory()
                    ? customFolder.listFiles().findAll { it.isFile() } : []
            if (customZip != null) {
                inputs.file(customZip)
            } else if (customFolderFiles) {
                inputs.files(customFolderFiles)
            }
            outputs.file(outFile)
            doLast {
                def inputJar = source.files.find { it.name.endsWith("-${platform}.jar") }
                def target = outFile.get().asFile
                target.parentFile.mkdirs()

                // The bytedeco FFmpeg libraries can be replaced by custom minimal builds (same
                // FFmpeg release, so bytedeco's JNI wrappers bind against them unchanged): the
                // zips committed under the ffmpeg_libraries folder (gradle/ffmpeg/libraries by
                // default). Entries whose file name matches a custom library are replaced by its
                // bytes.
                def customLibs = [:]
                if (ffmpegLibsDir && customZip == null && customFolderFiles.isEmpty()) {
                    logger.warn("No minimal FFmpeg libraries for {} in {} - bundling the prebuilt " +
                            "bytedeco libraries (run the ffmpeg.yml workflow and commit its zips?)",
                            platform, customBase)
                }
                if (customZip != null) {
                    new java.util.zip.ZipFile(customZip).withCloseable { z ->
                        z.entries().each { entry ->
                            if (!entry.directory) {
                                customLibs[entry.name.tokenize('/')[-1]] = z.getInputStream(entry).bytes
                            }
                        }
                    }
                } else if (customFolderFiles) {
                    customFolderFiles.each { file -> customLibs[file.name] = file.bytes }
                }

                new java.util.zip.ZipFile(inputJar).withCloseable { zip ->
                    new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(target)).withCloseable { out ->
                        out.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
                        def replaced = []
                        zip.entries().each { entry ->
                            def name = entry.name.tokenize('/')[-1]
                            def dropped = name.contains('avdevice') || name.contains('avfilter')
                                    || name.contains('postproc') || name.startsWith('jnijavacpp')
                                    || name in ['ffmpeg', 'ffprobe', 'ffmpeg.exe', 'ffprobe.exe']
                                    || entry.name.startsWith('META-INF/native-image/')
                            if (dropped) {
                                return
                            }
                            out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (entry.name == 'META-INF/MANIFEST.MF') {
                                // NeoForge loads nested jars as Java modules, and no valid module
                                // name can be derived from "...-x86_64" (a segment may not start
                                // with a digit): name it explicitly.
                                def manifest = new java.util.jar.Manifest(zip.getInputStream(entry))
                                manifest.mainAttributes.putValue('Automatic-Module-Name',
                                        "net.bluegaria.ffmpeg.natives.${platform.replace('-', '_')}")
                                manifest.write(out)
                            } else if (customLibs.containsKey(name)) {
                                // Custom minimal build replaces the bytedeco library by name.
                                out.write(customLibs[name])
                                replaced << name
                            } else if (!entry.directory) {
                                zip.getInputStream(entry).withCloseable { it.transferTo(out) }
                            }
                            out.closeEntry()
                        }
                        if (customLibs) {
                            def unmatched = (customLibs.keySet() - replaced).toSorted()
                            if (unmatched) {
                                logger.warn("Custom FFmpeg libraries not matched against the bytedeco jar for {} " +
                                        "(name mismatch? they were not bundled): {}", platform, unmatched)
                            } else {
                                logger.lifecycle("Bundled custom minimal FFmpeg libraries for {}: {}", platform, replaced.toSorted())
                            }
                        }
                    }
                }
            }
        }
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'FfmpegNatives'
                    url = ffmpegMaven
                    // The repository only holds the trimmed jars, no POMs.
                    metadataSources { artifact() }
                }
            }
            filter {
                includeGroup 'net.bluegaria.ffmpeg'
            }
        }
    }
}


dependencies {
    // Video playback: FFmpeg is bundled with the mod (JavaCPP presets), so nothing has to be
    // installed on the system. libavformat demuxes the WebM container, libavcodec decodes
    // (VP9 video, Opus audio), libswscale converts pictures to RGBA and libswresample
    // resamples the sound for audio output. Nesting them into the jar is loader-specific
    // (gradle/fabric.gradle, gradle/neoforge.gradle).
    implementation "org.bytedeco:javacpp:${project.javacpp_version}"
    implementation "org.bytedeco:ffmpeg:${project.ffmpeg_version}"
    // In the dev environment the natives for the running platform come from these jars as well;
    // the built jar nests only trimmed copies (see the trimFfmpegNatives tasks above).
    ffmpegPlatforms.each { platform ->
        implementation "org.bytedeco:ffmpeg:${project.ffmpeg_version}:${platform}"
    }
}

// The mixins that only exist in some versions, registered by aura-intro.versioned.mixins.json.
def versionedMixins = []
if (sc.current.parsed.matches('>=26.1')) {
    versionedMixins << 'GuiGraphicsExtractorInvoker'
} else {
    versionedMixins << 'GuiGraphicsInvoker'
}

// Fills in the version placeholders of the mod metadata and the mixin configs.
def expandProps = [
        "version"                    : project.version.toString(),
        "minecraft_version"          : sc.current.version,
        "loader_version"             : project.loader_version.toString(),
        "fabric_minecraft_dependency": project.fabric_minecraft_dependency.toString(),
        "neoforge_minecraft_range"   : project.neoforge_minecraft_range.toString(),
        "neoforge_range"             : project.neoforge_range.toString(),
        "cloth_config_min"           : project.cloth_config_min.toString(),
        "modmenu_min"                : project.modmenu_min.toString(),
        "mixin_compat"               : project.mixin_compat.toString(),
        "versioned_mixins"           : versionedMixins.collect { "\"${it}\"" }.join(', ')
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties(expandProps)
    filteringCharset "UTF-8"

    // Each loader only gets its own mod metadata.
    if (loader == 'fabric') {
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        exclude 'fabric.mod.json'
    }

    filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml",
                   "aura-intro.client.mixins.json", "aura-intro.versioned.mixins.json"]) {
        expand expandProps
    }
}

def targetJavaVersion = (project.java_target as String).toInteger()
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE.txt")) {
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
}
