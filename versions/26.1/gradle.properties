# Minecraft 26.1 build properties
minecraft_version=26.1
fabric_version=0.155.3+26.1.2
# Java bytecode target: Minecraft 26.x runs on Java 25
java_target=25
mixin_compat=JAVA_25
# fabric.mod.json dependency declarations
minecraft_dependency=>=26.1 <26.2
cloth_config_dependency=>=26.1.154
modmenu_dependency=>=18.0.0
# Mod Menu (optional, not bundled) + its required Placeholder API (dev runtime only)
modmenu_version=18.0.2
placeholder_api_version=3.0.0+26.1
# Cloth Config - provides the in-game config screen (bundled via jar-in-jar)
cloth_config_version=26.1.154+fabric
versioned_mixins="GuiGraphicsExtractorInvoker"
