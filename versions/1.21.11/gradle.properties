# Minecraft 1.21.11 build properties
minecraft_version=1.21.11
fabric_version=0.141.6+1.21.11
# Java bytecode target: Minecraft 1.21.x runs on Java 21
java_target=21
mixin_compat=JAVA_21
# fabric.mod.json dependency declarations
minecraft_dependency=>=1.21.11 <1.22
cloth_config_dependency=>=21.11.0
modmenu_dependency=>=17.0.0
# Mod Menu (optional, not bundled) + its required Placeholder API (dev runtime only)
modmenu_version=17.0.1
placeholder_api_version=2.8.2+1.21.10
# Cloth Config - provides the in-game config screen (external dependency, NOT bundled;
# compile-time and dev-runtime only)
cloth_config_version=21.11.153+fabric
versioned_mixins="GuiGraphicsInvoker"
