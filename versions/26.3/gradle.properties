# Minecraft 26.3 build properties
minecraft_version=26.3
fabric_version=0.161.0+26.3
# Java bytecode target: Minecraft 26.x runs on Java 25
java_target=25
mixin_compat=JAVA_25
# fabric.mod.json dependency declarations
minecraft_dependency=>=26.3 <26.4
cloth_config_dependency=>=26.3.159
modmenu_dependency=>=21.0.0
# Mod Menu (optional, not bundled) + its required Placeholder API (dev runtime only)
modmenu_version=21.0.0
placeholder_api_version=3.2.0+26.3
# Cloth Config - provides the in-game config screen (external dependency, NOT bundled;
# compile-time and dev-runtime only)
cloth_config_version=26.3.159+fabric
versioned_mixins="GuiGraphicsExtractorInvoker"
